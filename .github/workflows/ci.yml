name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Update npm
        run: npm install --global npm@12.2.0

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

name: Release (tag)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Update npm
        run: npm install --global npm@12.2.0

      - name: Install (root)
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Create release package zip
        run: |
          VERSION="${GITHUB_REF_NAME}"

          mkdir -p release_package

          for workspace in server shared web-dm web-player docs scripts; do
            mkdir -p "release_package/${workspace}"
            rsync -a --exclude=node_modules "${workspace}/" "release_package/${workspace}/"
          done

          # Include root entry points and configuration used by workspace commands.
          for f in README.md LICENSE .nvmrc package.json package-lock.json eslint.config.cjs knip.json start.bat update-beholden.bat; do
            if [ -f "$f" ]; then cp "$f" release_package/; fi
          done

          ZIP_NAME="beholden-${VERSION}.zip"
          (cd release_package && zip -r "../${ZIP_NAME}" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release + Upload Asset
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
